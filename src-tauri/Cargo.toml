[package]
name = "resume-studio"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/cryer/SimpleResume"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tempfile = "3"

percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell_Common"] }

[dev-dependencies]
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
